<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:14px Segoe UI,Arial,sans-serif;width:310px;margin:0;padding:18px;background:#111611;color:#edf2e8}
h1{font-size:17px;margin:0 0 8px}p{font-size:12px;color:#a8b2a1;line-height:1.5}
button{width:100%;padding:11px;border:0;border-radius:7px;background:#c3f36b;color:#1a2115;font-weight:700;cursor:pointer}
#status{min-height:18px;margin-top:12px;font-size:11px;color:#c3f36b}
small{display:block;color:#7f8978;margin-top:12px;line-height:1.4}
</style></head>
<body>
<h1>Legacy Bridge</h1>
<p>Opens the current page in a separate window for websites that rely on the older Windows browser engine.</p>
<button id="open">Open page in Legacy Bridge</button>
<div id="status" role="status"></div>
<small>Use only with websites you are authorized to access. The Legacy Bridge window opens separately from Chrome.</small>
<script src="popup.js"></script>
</body></html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:14px Segoe UI,Arial,sans-serif;width:310px;margin:0;padding:18px;background:#111611;color:#edf2e8}
h1{font-size:17px;margin:0 0 8px}p{font-size:12px;color:#a8b2a1;line-height:1.5}
button{width:100%;padding:11px;border:0;border-radius:7px;background:#c3f36b;color:#1a2115;font-weight:700;cursor:pointer}
#status{min-height:18px;margin-top:12px;font-size:11px;color:#c3f36b}
small{display:block;color:#7f8978;margin-top:12px;line-height:1.4}
</style></head>
<body>
<h1>Legacy Bridge</h1>
<p>Abre a página ativa numa janela auxiliar compatível com sites que dependem do mecanismo antigo do Windows.</p>
<button id="open">Abrir página nesta janela</button>
<div id="status" role="status"></div>
<small>Use apenas no site legado autorizado. A janela auxiliar não fica dentro da aba do Chrome.</small>
<script src="popup.js"></script>
</body></html>
